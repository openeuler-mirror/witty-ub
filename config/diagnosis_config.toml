[db]
pg_host = "127.0.0.1"
pg_port = 15432
pg_database = "witty-ub"
pg_user = "witty-ub"
pg_password = "witty-ub"
pg_pool_size = 5
pg_max_overflow = 10

[task]
max_concurrent_tasks = 9
# 后台任务硬超时(秒)：超时强制终止并自动重试，防止挂死子进程永久占用并发槽；0 关闭看门狗
task_timeout_seconds = 3600
# RUNNING 任务连续无对应存活进程达到该秒数后回收重试
stale_running_grace_seconds = 60

[log_filename_pattern]
ds_client_access_log_file = ["ds_client_access*.log", "*_access.log", "*_split_access.log"]
ds_client_info_log_file = ["ds_client*.INFO.log", "*_runtime.log", "*_split_runtime.log"]
ds_worker_access_log_file = ["access.log", "access*.log", "*_access.log", "*_split_access.log"]
ds_worker_info_log_file = ["datasystem_worker.INFO*.log", "kvcache.INFO*.log", "*_runtime.log", "*_split_runtime.log"]
resource_log_file = ["resource.log"]

[log_analyzer_params]
total_p99_threshold_ms = 2.0
c2w_p99_threshold_ms = 2.0
urma_link_p99_threshold_ms = 4.0
total_p9999_threshold_ms = 5.0
total_pmax_threshold_ms = 20.0
total_ave_threshold_ms = 2.0
zone_anomaly_density_threshold = 0.5
