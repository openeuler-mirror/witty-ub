#
# 部署形态（按 profile 选择，互斥，不要同时启动）:
#   单机 All-in-One : docker compose --profile allinone up -d
#   前后端分离      : docker compose --profile split up -d
# 说明: postgres 服务不带 profile（两个形态共用数据库）；直接 `docker compose up -d`
#       只会拉起 postgres，请显式指定上面的 profile。
# 镜像: 各服务同时声明了 build/image —— 本地已有 image 时 compose 直接使用，
#       否则会尝试从源码构建（需要先构建 base 镜像，见 docs/package/01-docker-build.md）。
#       只想用现成镜像时，先 `docker pull <harbor>/witty-ub:<role>` 并
#       `docker tag` 成 witty-ub:<role>，再执行上面的 up 命令。
# 注意: 本文件与 deploy/docker/manage.sh（脚本部署）使用相同的容器名/卷名/网络名，
#       两套方式互斥；混用会出现同名容器冲突。

services:
  postgres:
    image: quay.io/sclorg/postgresql-15-c9s:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    volumes:
      - pg15-data:/var/lib/pgsql/data
    secrets:
      - pg_password
    environment:
      - POSTGRESQL_USER=witty-ub
      - POSTGRESQL_DATABASE=witty-ub
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        export POSTGRESQL_PASSWORD="$$(tr -d '\r\n' </run/secrets/pg_password)";
        test -n "$$POSTGRESQL_PASSWORD" || exit 1;
        exec /usr/bin/container-entrypoint /usr/bin/run-postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "witty-ub", "-d", "witty-ub"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - witty-ub-network

  witty-ub:
    build:
      context: .
      dockerfile: Dockerfile
    image: witty-ub:latest
    profiles: ["allinone"]
    container_name: witty-ub
    restart: unless-stopped
    ports:
      - "32412:8080" # Web UI (Nginx + API proxy)
    volumes:
      # Persistent data storage
      - witty-ub-data:/var/witty-ub/data
      - witty-ub-logs:/var/log/witty-ub
      # Optional: Mount uploaded files
      - witty-ub-uploads:/var/witty-ub/latency/file/file_upload
      - witty-ub-results:/var/witty-ub/latency/file/file_parse_result
      # opencode
      - ~/.config/opencode:/root/.config/opencode
      # experience-skill persistent data (experience.db)
      - witty-ub-experience-data:/var/witty-ub/witty_ub_diagnostician/.opencode/skills/experience-skill/data
    secrets:
      - pg_password
    environment:
      # Python path for latency plugin
      - PYTHONPATH=/var/witty-ub
      # Log level (optional)
      - LOG_LEVEL=info
      # PostgreSQL 连接（容器内通过容器名 postgres 访问，端口为容器内 5432）
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=witty-ub
      - PG_USER=witty-ub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9772/health_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - witty-ub-network

  # ── 前后端分离部署（docker compose --profile split up） ──
  # 同一镜像按 WITTY_ROLE 分角色: backend 跑 FastAPI+数据卷, frontend 跑
  # Nginx+OpenCode（LLM key 与经验库随前端节点）, 前端反代后端 9772。
  witty-ub-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    image: witty-ub:backend
    profiles: ["split"]
    container_name: witty-ub-backend
    restart: unless-stopped
    volumes:
      - witty-ub-data:/var/witty-ub/data
      - witty-ub-logs:/var/log/witty-ub
      - witty-ub-uploads:/var/witty-ub/latency/file/file_upload
      - witty-ub-results:/var/witty-ub/latency/file/file_parse_result
    secrets:
      - pg_password
    environment:
      - WITTY_ROLE=backend
      # Python path for latency plugin
      - PYTHONPATH=/var/witty-ub
      # Log level (optional)
      - LOG_LEVEL=info
      # PostgreSQL 连接（容器内通过容器名 postgres 访问，端口为容器内 5432）
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=witty-ub
      - PG_USER=witty-ub
    networks:
      - witty-ub-network

  witty-ub-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    image: witty-ub:frontend
    profiles: ["split"]
    container_name: witty-ub-frontend
    restart: unless-stopped
    depends_on:
      witty-ub-backend:
        condition: service_healthy
    ports:
      - "32413:8080" # Web UI (Nginx + 反代远端后端/本机 OpenCode)
    volumes:
      # OpenCode LLM 配置与经验库留在前端节点
      - ~/.config/opencode:/root/.config/opencode
      # 日志卷与单机/后端保持一致（否则 /var/log/witty-ub 会生成匿名卷）
      - witty-ub-logs:/var/log/witty-ub
      # experience-skill persistent data (experience.db)
      - witty-ub-experience-data:/var/witty-ub/witty_ub_diagnostician/.opencode/skills/experience-skill/data
    environment:
      - WITTY_ROLE=frontend
      # 容器网络内经服务名访问后端
      - WITTY_BACKEND_URL=http://witty-ub-backend:9772
    networks:
      - witty-ub-network

volumes:
  pg15-data:
    driver: local
    name: pg15-data
  witty-ub-data:
    driver: local
    name: witty-ub-data
  witty-ub-logs:
    driver: local
    name: witty-ub-logs
  witty-ub-uploads:
    driver: local
    name: witty-ub-uploads
  witty-ub-results:
    driver: local
    name: witty-ub-results
  witty-ub-experience-data:
    driver: local
    name: witty-ub-experience-data

networks:
  witty-ub-network:
    driver: bridge
    name: witty-ub-network

secrets:
  pg_password:
    file: ${PG_SECRET_FILE:-/etc/witty-ub/pg.passwd}
