version: '3.8'

services:
  postgres:
    image: quay.io/sclorg/postgresql-15-c9s:latest
    container_name: postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    volumes:
      - pg15-data:/var/lib/pgsql/data
    environment:
      - POSTGRESQL_USER=witty-ub
      - POSTGRESQL_PASSWORD=witty-ub
      - POSTGRESQL_DATABASE=witty-ub
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "witty-ub"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - witty-ub-network

  witty-ub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: witty-ub
    restart: unless-stopped
    ports:
      - "32412:8080"  # Web UI (Nginx + API proxy)
    volumes:
      # Persistent data storage
      - witty-ub-data:/var/witty-ub/data
      - witty-ub-logs:/var/log/witty-ub
      # Optional: Mount uploaded files
      - witty-ub-uploads:/var/witty-ub/latency/file/file_upload
      - witty-ub-results:/var/witty-ub/latency/file/file_parse_result
      # opencode
      - ~/.config/opencode:/root/.config/opencode
    environment:
      # Python path for latency plugin
      - PYTHONPATH=/var/witty-ub
      # Log level (optional)
      - LOG_LEVEL=info
      # PostgreSQL 连接（容器内通过容器名 postgres 访问，端口为容器内 5432）
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=witty-ub
      - PG_USER=witty-ub
      - PG_PASSWORD=witty-ub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9772/health_check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - witty-ub-network

volumes:
  pg15-data:
    driver: local
  witty-ub-data:
    driver: local
  witty-ub-logs:
    driver: local
  witty-ub-uploads:
    driver: local
  witty-ub-results:
    driver: local

networks:
  witty-ub-network:
    driver: bridge
