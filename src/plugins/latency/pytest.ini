[pytest]
asyncio_mode = auto
markers =
    integration: Integration tests (slow, requires test data)
addopts =
    -q
    --cov=latency
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=80
    --ignore=test/test_all_apis.py
    --ignore=test/test_full_link.py
    --ignore=test/test_scheduler_run.py
    --ignore=test/test_task_service.py
    --ignore=test/test_kv_cache_log_parse_worker.py
    --ignore=test/test_kv_cache_log_parse_worker_profile.py
    --ignore=test/test_log_parser.py
    --ignore=test/test_database_unit.py
    --ignore=test/test_api_unit.py
    --ignore=test/test_api_full_content.py
    --ignore=test/test_postgresql_integration.py
    --ignore=test/test_deploy_integration.py
    --ignore=test/test_polars_pipeline_parity.py
    --ignore=test/test_scan_merge_parity.py
    --ignore=test/test_scan_io_decouple.py
