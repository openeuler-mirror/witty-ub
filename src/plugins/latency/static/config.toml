
# DS日志分析配置
[DS_LOG_ANALYZER]
# 异常检测阈值，单位毫秒
TOTAL_P99_THRESHOLD_MS = 2.0
C2W_P99_THRESHOLD_MS = 2.0
W2W_P99_THRESHOLD_MS = 1.5
URMA_LINK_P99_THRESHOLD_MS = 4
QUERY_META_P99_THRESHOLD_MS = 1.0

# 多窗口配置（每个指标都会使用所有窗口检测）
# 小窗口检测快速突刺，大窗口检测持续劣化
SLIDING_WINDOW_SIZES = [100, 200, 300, 500]
SLIDING_WINDOW_STEPS = [20, 30, 40, 50]

# 区间异常密度阈值，超过此比例则整个区间标记为异常
ZONE_ANOMALY_DENSITY_THRESHOLD = 0.5

# 日志文件路径配置（可选，不配置则使用默认模式）
# ds-client-access-log-file 和 ds-client-info-log-file 合并为 SDK_ACCESS_LOG_PATTERNS
# ds-worker-access-log-file 映射为 WORKER_ACCESS_LOG_PATTERNS
# ds-worker-info-log-file 映射为 URMA_LOG_PATTERNS, REMOTE_PULL_LOG_PATTERNS, LINK_LOG_PATTERNS, QUERY_META_LOG_PATTERNS
ds-client-access-log-file = ["ds_client_access*.log", "ds_client_access*.log.gz"]
ds-client-info-log-file = []
ds-worker-access-log-file = ["access.log", "access.log.gz"]
ds-worker-info-log-file = ["datasystem_worker.INFO.*", "kvcache.INFO.*"]
