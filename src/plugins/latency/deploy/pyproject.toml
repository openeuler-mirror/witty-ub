[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latency"
version = "0.1.0"
description = "Latency plugin for log parsing and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.110.2",
    "uvicorn==0.21.0",
    "apscheduler==3.10.4",
    "pydantic==2.12.3",
    "python-multipart==0.0.20",
    "aiohttp==3.9.5",
    "aiofiles==25.1.0",
    "chardet==4.0.0",
    "requests==2.32.2",
    "toml==0.10.2",
    "httpx==0.27.0",
    "rarfile>=4.0",
    ]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx==0.27.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["latency*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
