[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latency"
version = "0.1.0"
description = "Latency plugin for log parsing and anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "apscheduler>=3.10.0",
    "pydantic>=2.6.0",
    "openai>=1.12.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "chardet>=5.2.0",
    "requests>=2.31.0",
    "toml>=0.10.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["latency*"]
