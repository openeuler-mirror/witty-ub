<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>witty-ub failure mode view</title>
<style>
__FAILURE_MODE_VIEW_CSS__
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <h1>Failure Mode View</h1>
    <div class="tabs" id="treeTabs" role="tablist" aria-label="Failure mode trees"></div>
    <label for="searchBox">Search</label>
    <input id="searchBox" type="search" placeholder="id / name">
    <div class="buttons">
      <button class="primary" id="fitBtn" type="button">Fit</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
    <div class="metrics">
      <div class="metric"><strong id="nodeCount">0</strong><span>Nodes</span></div>
      <div class="metric"><strong id="edgeCount">0</strong><span>Edges</span></div>
      <div class="metric"><strong id="maxDepth">0</strong><span>Depth</span></div>
      <div class="metric"><strong id="maxHit">0</strong><span>Max hit</span></div>
    </div>
  </aside>
  <main class="graph-wrap">
    <svg id="graph" role="img" aria-label="failure mode tree"></svg>
    <div class="empty" id="emptyState">No failure mode tree data</div>
  </main>
  <aside class="detail">
    <h2 id="detailTitle">Details</h2>
    <div id="detailBody"></div>
  </aside>
</div>
<script>
const FAILURE_MODE_VIEW_DATA = __FAILURE_MODE_VIEW_DATA__;
</script>
<script>

</script>
</body>
</html>
