[service]
is_debug = true
uvicorn_ip = "0.0.0.0"
uvicorn_port = 9988
ssl_enable = false
log_level = "INFO"

# deploy/docker/deploy_rag.sh 会在运行时重写以下两个数据库配置段，
# 让标量数据和向量数据都存储到脚本管理的 openGauss 容器。
[scalar_db]
database_type = "opengauss"
database_host = "opengauss-rag"
database_port = 5432
database_user = "gaussdb"
database_password = "replaced-at-deploy-time"
database_db = "postgres"
database_pool_size = 10

[vector_db]
database_type = "opengauss"
database_host = "opengauss-rag"
database_port = 5432
database_user = "gaussdb"
database_password = "replaced-at-deploy-time"
database_db = "postgres"
database_pool_size = 10

[graph_db]

[task]
task_retry_time = 3
cpu_limit = 4

[static_source]
aes_key = ""
stop_words_path = ""
prompt_template_path = ""

# 部署前请填写实际使用的模型提供商、地址、模型名称和 API Key。
[chat_model]
model_name = ""
online_status = "online"
model_provider = "openai"
end_point = ""
api_key = ""
request_timeout = 60
input_max_tokens = 32768
output_max_tokens = 4096
temperature = 0.7
batch_size = 16

[embedding_model]
model_name = ""
online_status = "online"
model_provider = "openai"
end_point = ""
api_key = ""
request_timeout = 60
batch_size = 16

[rerank_model]
model_name = ""
online_status = "offline"
model_provider = "other"
end_point = ""
api_key = ""

[ocr_model]
online_status = "offline"

[voice_to_text_model]
online_status = "offline"

[video_to_text_model]
online_status = "offline"
