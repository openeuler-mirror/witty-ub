# witty-ub 部署配置文件（数据库 + 容器 + OpenCode 等部署参数）
# 本配置同时适用于 RPM 部署和 Docker 容器部署

# ---------- 数据库连接配置 ----------
# 与 config/diagnosis_config.toml [db] 段保持一致
# 注意：PG_HOST 分两种场景
#   - 宿主机访问（RPM 部署的 PG）: 127.0.0.1（端口 PG_PORT_RPM=5432）
#   - 容器内访问（witty-ub 容器连宿主机 RPM PG）: 172.18.0.1（Docker 网关，端口 PG_PORT_RPM=5432）
#   - 容器内访问（witty-ub 容器连 PG 容器）: postgres（走 Docker 网络，容器名即 DNS，端口 5432）
PG_HOST="127.0.0.1"
# PG_HOST_IN_CONTAINER 和 PG_PORT_IN_CONTAINER：
#   留空（或不设置）则由脚本自动检测：
#     - 检测到同网络 PG 容器 → 用容器名:5432
#     - 检测到宿主机 RPM PG → 用 Docker 网关IP:监听端口
#     - 都没检测到 → 用 postgres:5432
#   也可以手动指定覆盖自动检测（如 PG_HOST_IN_CONTAINER="172.18.0.1"）
PG_HOST_IN_CONTAINER=""
PG_PORT_IN_CONTAINER=""
# 宿主机源码/RPM 部署专用：PostgreSQL 监听端口。
# （deploy_pg.sh 写入 postgresql.conf 的 port，manager.sh 同步到 diagnosis_config.toml）。
# Docker 部署不读此字段。回归 PostgreSQL 标准端口 5432。
PG_PORT_RPM="5432"
# Docker 部署用：PG 容器的"宿主机映射端口"（docker run -p PG_PORT:5432）。
# 注意：应用容器连接 PG 用的不是这个值，而是 PG_HOST_IN_CONTAINER / PG_PORT_IN_CONTAINER
#       （留空自动探测）。本字段只影响宿主机侧 psql 等客户端以及端口冲突规避；
#       改应用连接请改上面两个 PG_*_IN_CONTAINER 字段。
PG_PORT="15432"
PG_DATABASE="witty-ub"
PG_USER="witty-ub"
PG_PASSWORD="<CHANGE_ME>"
# 注意: PG_PASSWORD 仅作占位符。实际口令由 deploy_pg.sh 的 ensure_pg_password()
# 写入独立密钥文件：
#   源码 host 部署（deploy_pg.sh --rpm/--apt）→ deploy/pg.passwd（0600）
#   容器部署（deploy_pg.sh --docker）与 RPM 包部署（witty-ub manager deploy）
#                                            → /etc/witty-ub/pg.passwd（容器 0440，RPM 0600）

# 连接池参数（仅供应用层参考，部署脚本不直接使用）
PG_POOL_SIZE="10"
PG_MAX_OVERFLOW="20"

# ---------- RPM 部署专用 ----------
# PostgreSQL 数据目录（留空则根据已安装的包自动探测）
#   postgresql15-server  -> /var/lib/pgsql/15/data
#   postgresql-server     -> /var/lib/pgsql/data
PG_DATA_DIR=""

# PostgreSQL 服务名（systemd，留空则根据已安装的包自动探测）
#   postgresql15-server  -> postgresql-15
#   postgresql-server     -> postgresql
PG_SERVICE_NAME=""

# ---------- Docker 部署专用 ----------
# 容器名称
PG_CONTAINER_NAME="postgres"

# 镜像地址
PG_IMAGE="quay.io/sclorg/postgresql-15-c9s:latest"

# Docker 网络名（与 witty-ub 容器共用）
PG_NETWORK="witty-ub-network"

# Docker 卷名（数据持久化）
PG_VOLUME="pg15-data"

# 容器内数据目录
PG_CONTAINER_DATA_DIR="/var/lib/pgsql/data"

# 健康检查参数
PG_HEALTH_INTERVAL="30s"
PG_HEALTH_TIMEOUT="10s"
PG_HEALTH_RETRIES="3"
PG_HEALTH_START_PERIOD="40s"

# ---------- witty-ub 容器部署专用 ----------
# witty-ub 容器名称
WITTY_CONTAINER_NAME="witty-ub"

# witty-ub 镜像（留空则按优先级自动选择）
#   1. hub-harbor.oepkgs.net/neocopilot/witty-ub:latest
#   2. witty-ub:latest
WITTY_IMAGE=""

# witty-ub 宿主机端口（容器内为 8080）
WITTY_HOST_PORT="32412"

# witty-ub 日志级别（debug / info / warning / error）
WITTY_LOG_LEVEL="info"

# Witty RAG MCP SSE 地址。Docker 部署必须使用容器 DNS 名，不能使用 localhost。
WITTY_RAG_MCP_URL="http://witty-rag-core:12312/sse"

# RAG 使用其他 Docker 网络时填写网络名；留空表示 RAG 与 witty-ub
# 已经共同加入 PG_NETWORK（推荐）。
WITTY_RAG_NETWORK=""

# ---------- Witty RAG + openGauss 容器部署专用 ----------
# 使用 deploy/docker/deploy_witty.sh --with-rag 时生效。
OPENGAUSS_RAG_CONTAINER="opengauss-rag"
# 留空时优先复用本地 Kunpeng HNSW 镜像；不存在时按宿主机架构选择上游固定摘要。
OPENGAUSS_RAG_IMAGE=""
OPENGAUSS_RAG_HOST_PORT="5440"
OPENGAUSS_RAG_VOLUME="opengauss-rag-data"
RAG_DB_USER="gaussdb"
RAG_DB_NAME="postgres"
# 文件中只放密码正文，权限必须为 0600；不会提交到仓库或写入镜像。
RAG_DB_SECRET_FILE="/etc/witty-ub/rag-opengauss.passwd"
# RAG API 访问密钥。首次部署时自动创建，文件仅保存密钥正文并设为 0600。
RAG_ACCESS_KEY_SECRET_FILE="/etc/witty-ub/rag-secrets/access-key"
# Embedding 与 rerank 共用的模型服务 API Key；只存放在 0600 文件中。
RAG_MODEL_API_KEY_SECRET_FILE="/etc/witty-ub/rag-secrets/model-api-key"
RAG_EMBEDDING_MODEL_NAME="BAAI/bge-m3"
RAG_EMBEDDING_MODEL_PROVIDER="openai"
RAG_EMBEDDING_ENDPOINT="https://api.siliconflow.cn/v1/embeddings"
RAG_RERANK_MODEL_NAME="BAAI/bge-reranker-v2-m3"
# 当前 RAG Core 的 guijiliudong 协议与 SiliconFlow rerank 请求/响应兼容。
RAG_RERANK_MODEL_PROVIDER="guijiliudong"
RAG_RERANK_ENDPOINT="https://api.siliconflow.cn/v1/rerank"

WITTY_RAG_CORE_CONTAINER="witty-rag-core"
WITTY_RAG_CORE_IMAGE="hub-harbor.oepkgs.net/neocopilot/witty-rag-core:0.10.2-release-arm"
# 基于上面镜像构建、同时运行 REST 与 MCP SSE 的本地镜像。
WITTY_RAG_MCP_IMAGE="witty-rag-core:mcp"
WITTY_RAG_CORE_HOST_PORT="9990"
RAG_WORKERS="4"
# RAG Core 配置文件。留空时使用本文件同目录下的 rag-core.toml。
RAG_CONFIG_FILE=""
RAG_RUNTIME_DIR="/opt/witty-rag"

# ---------- 现象索引（RAG REST，与 MCP 通道独立） ----------
# 后端访问 RAG Core 的 REST 基址；留空按网络模式推导：
#   bridge → http://<RAG 容器名>:9988，host → http://127.0.0.1:<WITTY_RAG_CORE_HOST_PORT>
RAG_CORE_URL=""
# 访问密钥文件；留空复用 RAG_ACCESS_KEY_SECRET_FILE，只读挂入后端容器。
RAG_ACCESS_KEY_FILE=""
# 现象专用知识库 ID，由 phenomenon_cli --init-kb 创建后回填；未填时不启用索引。
RAG_PHENOMENON_KB_ID=""
# 灰度开关：影子索引阶段 INDEX=true、SEARCH=false。
PHENOMENON_INDEX_ENABLED="false"
PHENOMENON_SEARCH_ENABLED="false"
# 召回条数、归一化分数阈值与扫描周期，留空使用后端默认。
RAG_MIN_SCORE=""
RAG_TOP_K=""
RAG_INDEX_INTERVAL=""

# 受控审核：设为 true 后，报告确认、报告建案、案例确认与验证回填只接受认证网关注入的
# X-Witty-Operator，忽略请求体操作人；缺少请求头返回 400。未接入认证网关时保持 false。
WITTY_REQUIRE_TRUSTED_OPERATOR="false"

# OpenCode 配置目录（宿主机，留空使用默认 ~/.config/opencode）
OPENCODE_CONFIG_DIR=""

# witty-ub 容器额外目录挂载（可选，用于容器访问宿主机上的日志/数据文件）
# 格式：宿主机路径:容器内路径[:ro|rw]  多个用空格分隔，ro=只读（推荐），rw=读写
# 示例：WITTY_EXTRA_MOUNTS="/data/logs:/var/witty-ub/host_logs:ro /data/models:/var/witty-ub/models:ro"
WITTY_EXTRA_MOUNTS="/home:/home:ro"

# 诊断报告目录（容器内，默认 /var/witty-ub/reports）
# 部署脚本固定挂载独立卷 witty-ub-reports 到此路径：agent 生成报告写卷内，
# 后端 /diagnostic_report 从这里读列表与下发 HTML，容器重建后报告不丢。
# 宿主机路径：docker volume inspect witty-ub-reports → Mountpoint
# （目录按知识库分：<kb_id>/report_<kb_id>_<时间戳>.html + 同名 .json 侧车）

# ---------- 容器运行时配置（网络 / SSL / seccomp；完整规则见 docs/usage/03-configuration-reference.md） ----------
# Docker 网络模式: bridge（默认，接入 PG_NETWORK 组网）| host（共享宿主机网络，端口映射被忽略，
#   Web UI → http://<宿主机IP>:8080、后端 9772，PG 直接占用宿主机 5432，容器内走 127.0.0.1 互访）
WITTY_NETWORK_MODE="bridge"

# 容器级网络模式覆盖（留空继承 WITTY_NETWORK_MODE）: 一体只认 _APP；分离同机要求 _BACKEND 与 _FRONTEND
# 一致，分离跨机只填本机键，PG 容器认 _PG；混合组合能推导地址但不保证可用，建议整机统一 host
WITTY_NETWORK_MODE_PG=""
WITTY_NETWORK_MODE_APP=""
WITTY_NETWORK_MODE_BACKEND=""
WITTY_NETWORK_MODE_FRONTEND=""

# 部署后逐链路自检（容器内探 /health_check）；失败回退: prompt（默认，打印建议命令）| auto（自动切 host 重跑）| off
WITTY_NETWORK_SELFCHECK="true"
WITTY_NETWORK_FALLBACK="prompt"

# OpenCode/LLM 出网 HTTPS 证书校验: true（默认）| false（关闭，注入 NODE_TLS_REJECT_UNAUTHORIZED=0）
WITTY_SSL_VERIFY="true"

# seccomp 策略: default（默认）| unconfined（关闭过滤，旧版 Docker<20.10/libseccomp<2.5 的 clone3 报错场景）
WITTY_SECCOMP="default"

# 容器时区（容器内 TZ；PG 容器同时注入 PGTZ）。日志墙钟为 +08，默认与日志一致。
# 资产创建/更新时间在 API 中保留时区偏移，由前端转换为浏览器本地时间。
WITTY_TZ="Asia/Shanghai"

# ---------- 前后端分离部署（deploy_witty.sh --role backend/frontend） ----------
# 后端容器宿主机端口（容器内 9772，供前端节点反代）
WITTY_BACKEND_HOST_PORT="9772"
# 前端容器宿主机端口（容器内 8080）
WITTY_FRONTEND_HOST_PORT="32413"
# 前端容器内反代上游（WITTY_BACKEND_URL）；留空自动用 http://<容器名>-backend:9772
# 跨机部署时改为 http://<后端机器IP>:9772
WITTY_BACKEND_URL=""
