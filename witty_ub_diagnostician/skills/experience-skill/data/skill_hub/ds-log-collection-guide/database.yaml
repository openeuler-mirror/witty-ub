- testcase1:
    question: 如何开启 yuanrong-datasystem 的访问日志和资源日志？
    answer: 设置 gflag --log_monitor=true，资源日志还需要 --log_monitor_exporter=harddisk。
- testcase2:
    question: log_rate_limit 的采样粒度是什么？
    answer: 采样粒度是请求（traceId），不是单条日志；仅 SDK 请求 trace 参与采样，后台线程日志即使带 traceId 也不参与。
- testcase3:
    question: 如何在不重启 Worker 的情况下调整日志采样率？
    answer: 修改 monitor_config_file 指定的配置文件（如 datasystem.config）中的 log_rate_limit 值，进程会周期性读取并热更新。
- testcase4:
    question: Client 日志文件名可以通过什么方式自定义？
    answer: 通过环境变量 DATASYSTEM_CLIENT_LOG_NAME 和 DATASYSTEM_CLIENT_ACCESS_LOG_NAME 覆盖默认的 ds_client_{pid} 和 ds_client_access_{pid}。
